[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo-snippet = "0.6.5"

# === AtCoder utility crates (kept) ===
ac-library-rs = "=0.2.0"
amplify = "=4.9.0"
bitset-fixed = "=0.1.0"
btreemultimap = "=0.1.1"
counter = "=0.7.0"
either = "=1.15.0"
fixedbitset = "=0.5.7"
indexmap = "=2.11.0"
itertools = "=0.14.0"
itertools-num = "=0.1.3"
maplit = "=1.0.2"
memoise = "=0.3.2"
num = "=0.4.3"
ordered-float = "=5.0.0"
pathfinding = "=4.14.0"
permutohedron = "=0.2.4"
petgraph = "=0.8.2"
primal = "=0.3.3"
proconio = { version = "=0.5.0", features = ["derive"] }
# regex = "=1.11.2"           # -> heavy (regex-automata + aho-corasick); proconio handles input
rustc-hash = "=2.1.1"
smallvec = "=1.15.1"
superslice = "=1.0.0"

