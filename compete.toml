# Path to the test file (Liquid template)
#
# Variables:
#
# - `manifest_dir`: Package directory
# - `contest`:      Contest ID (e.g. "abc100")
# - `bin_name`:     Name of a `bin` target (e.g. "abc100-a")
# - `bin_alias`:    "Alias" for a `bin` target defined in `pacakge.metadata.cargo-compete` (e.g. "a")
# - `problem`:      Alias for `bin_alias` (deprecated)
#
# Additional filters:
#
# - `kebabcase`: Convert to kebab case (by using the `heck` crate)
test-suite = "{{ manifest_dir }}/testcases/{{ bin_alias }}.yml"

# Open files with the command (`jq` command that outputs `string[] | string[][]`)
#
# VSCode:
#open = '[["code", "-a", .manifest_dir], ["code"] + (.paths | map([.src, .test_suite]) | flatten)]'
# Emacs:
#open = '["emacsclient", "-n"] + (.paths | map([.src, .test_suite]) | flatten)'

[template]
src = '''
#![allow(unused_imports)]
use proconio::input;

fn main() {
    input! {
        n: usize,
        a: [usize; n],
    }

}
'''

[template.new]
# `edition` for `Cargo.toml`.
edition = "2024"
# `profile` for `Cargo.toml`.
#
# By setting this, you can run tests with `opt-level=3` while enabling `debug-assertions` and `overflow-checks`.
#profile = '''
#[dev]
#opt-level = 3
#'''
dependencies = '''
# rust-analyzer (RA) load legend: ★★★ heavy / ★★ moderate / ★ minor. Unmarked = negligible.

# === Occasionally useful (uncomment when needed; heavier, kept off by default) === (heavy -> light)
# nalgebra = "=0.34.0"    # ★★★ full linear algebra (matrixmultiply/simba)
# statrs = "=0.18.0"      # ★★★ stats; pulls nalgebra
# regex = "=1.11.2"       # ★★★ regex-automata + aho-corasick + memchr (proconio handles input)
# varisat = "=0.2.2"      # ★★ SAT solver
# alga = "=0.9.3"         # ★ abstract-algebra traits (deprecated)
# bstr = "=1.12.0"        # ★ byte strings; memchr
# multiversion = "=0.8.0" # ★ proc-macro (CPU feature dispatch)
# thiserror = "=2.0.16"   # ★ proc-macro (error derive)
# -- below here: negligible RA load --
# glidesort = "=0.1.2"
# omniswap = "=0.1.0"
# recur-fn = "=2.2.0"
# indexing = "=0.4.1"
# tap = "=1.0.1"
# easy-ext = "=1.0.2"
# static_assertions = "=1.1.0"
# az = "=1.2.1"
# ascii = "=1.1.0"
# num-derive = "=0.4.2"
# num-iter = "=0.1.45"

# === Disabled (uncomment to re-enable; off -> no RA load, grouped by reason) ===
# argio = "=0.2.0"
# -- random: random testing is handled on the cargo-compete side --
# rand = "=0.9.2"
# rand_chacha = "=0.9.0"
# rand_core = "=0.9.3"
# rand_distr = "=0.5.1"
# rand_hc = "=0.4.0"
# rand_pcg = "=0.9.0"
# rand_xorshift = "=0.4.0"
# rand_xoshiro = "=0.7.0"
# getrandom = "=0.3.3"
# -- superseded / duplicate --
# lazy_static = "=1.5.0"      # -> std::sync::{OnceLock, LazyLock}
# bitvec = "=1.0.1"           # -> fixedbitset / bitset-fixed
# multimap = "=0.10.1"        # -> btreemultimap
# hashbag = "=0.1.12"         # -> counter / HashMap
# text_io = "=0.1.13"         # -> proconio
# libm = "=0.2.15"            # -> std f64/f32 methods; gamma/Bessel unused in ABC
# once_cell = "=1.21.3"       # -> std::sync::{OnceLock, LazyLock} / std::cell::OnceCell
# im-rc = "=15.1.0"
# rpds = "=1.1.1"
# -- bundled in a meta-crate (use the meta path, no separate dep) --
# amplify_derive / amplify_num                                       # -> amplify (amplify::derive / amplify::num)
# num-bigint / num-complex / num-integer / num-rational / num-traits # -> num (num::bigint / num::complex / num::integer / num::rational / num::traits)
# maplit = "=1.0.2"           # -> amplify

# === AtCoder utility crates (kept) === (heavy -> light)
ndarray = "=0.16.1"     # ★★ N-d arrays (transpose etc.); matrixmultiply
#petgraph = "=0.8.2"       # ★★ large generic graph crate
#num = "=0.4.3"            # ★★ bigint/complex/integer/rational/traits
itertools = "=0.14.0"     # ★★ many generic iterator adaptors
amplify = "=4.9.0"        # ★★ large; amplify_derive/_num bundled
pathfinding = "=4.14.0"   # ★ moderate
primal = "=0.3.3"         # ★ sieve/estimate/check + hamming
proconio = { version = "=0.5.0", features = ["derive"] } # ★ proc-macro (derive), otherwise small
# -- below here: negligible RA load (無視できる重さ)--
ac-library-rs = "=0.2.0"
bitset-fixed = "=0.1.0"  # bitset w/ << >> shl_or -> bit-DP; no ones()/set-ops
btreemultimap = "=0.1.1"
counter = "=0.7.0"
either = "=1.15.0"
fixedbitset = "=0.5.7"   # general set: ones() iter, union/intersection, subset; no shifts
indexmap = "=2.11.0"
itertools-num = "=0.1.3"
memoise = "=0.3.2"
ordered-float = "=5.0.0"
permutohedron = "=0.2.4"
rustc-hash = "=2.1.1"
#smallvec = "=1.15.1"
superslice = "=1.0.0"
'''
dev-dependencies = '''
'''


[new]
kind = "cargo-compete"
# Platform
#
# - atcoder
# - codeforces
# - yukicoder
platform = "atcoder"
# Path (Liquid template)
#
# Variables:
#
# - `contest`:      Contest ID. **May be nil**
# - `package_name`: Package name
path = "./src/contest/{{ contest }}"

#[new]
#kind = "oj-api"
#url = "https://atcoder.jp/contests/{{ id }}"
#path = "./{{ contest }}"

# for atcoder
# [add]
# url = 'https://atcoder.jp/contests/{{ args[0] | split: "_" | first }}/tasks/{{ args[0] }}'
#is-contest = ["false"] # optional
#target-kind = "bin" # ["bin", "example"]. default to "bin"
# bin-name = '{{ args[0] | replace: "_", "-" }}'
# bin-alias = '{{ args[0] }}'                    # optional
# bin-src-path = './src/bin/{{ args[0] }}.rs' # optional

# for Library-Checker
#[add]
#url = "https://judge.yosupo.jp/problem/{{ args[0] }}"
##is-contest = ["false"] # optional
##target-kind = "bin" # ["bin", "example"]. default to "bin"
#bin-name = '{{ args[0] }}'
##bin-alias = '{{ args[0] }}' # optional
##bin-src-path = './src/bin/{{ bin_alias }}.rs' # optional

# for yukicoder
# [add]
# url = 'https://yukicoder.me/problems/no/{{ args[0] }}'
#is-contest = ["bash", "-c", '[[ $(cut -d / -f 4) == "contests" ]]'] # optional
##target-kind = "bin" # ["bin", "example"]. default to "bin"
# bin-name = '{{ args[0] }}_yukicoder'
# bin-alias = '{{ args[0] }}' # optional
##bin-src-path = './src/bin/{{ bin_alias }}.rs' # optional

# Uses yukicoder configuration if the second argument is "yukicoder",
# otherwise defaults to atcoder
[add]
url = '{% if args.size > 1 and args[1] == "yukicoder" %}https://yukicoder.me/problems/no/{{ args[0] }}{% else %}https://atcoder.jp/contests/{{ args[0] | split: "_" | first }}/tasks/{{ args[0] }}{% endif %}'
bin-name = '{% if args.size > 1 and args[1] == "yukicoder" %}{{ args[0] }}_yukicoder{% else %}{{ args[0] | replace: "_", "-" }}{% endif %}'
bin-alias = '{{ args[0] }}'

[test]
# Toolchain for the test. (optional)
# toolchain = "1.42.0" # Rust 1.42.0
# toolchain = "1.70.0" # Rust 1.70.0
toolchain = "1.89.0" # Rust 1.89.0
# Profile for `cargo build`. ("dev" | "release")
#
# Defaults to `"dev"`.
#profile = "dev"

[submit]
kind = "file"
path = "{{ src_path }}"
